  <rect x="420" y="68" width="360" height="166" rx="7" fill="#0b0e14" stroke="#d8dce3" stroke-opacity=".9" stroke-width="2"/>
  <path d="M420 92 H780" stroke="#d8dce3" stroke-opacity=".7"/>
  <circle cx="440" cy="80" r="3" fill="#d8dce3" opacity=".85"/><circle cx="454" cy="80" r="3" fill="#d8dce3" opacity=".55"/><circle cx="468" cy="80" r="3" fill="#d8dce3" opacity=".35"/>
  <text x="600" y="151" text-anchor="middle" fill="#f3f4f6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" letter-spacing="4" opacity=".94">&lt; BUILD / LEARN / REPEAT &gt;</text>
  <path d="M516 180 H684" stroke="url(#fade)" stroke-width="2"/>
  <circle cx="250" cy="77" r="5" fill="#f3f4f6"/><circle cx="950" cy="78" r="5" fill="#f3f4f6"/>
