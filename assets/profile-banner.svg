<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Monochrome developer profile banner</title>
  <desc id="desc">A dark canvas with dotted wave forms around a minimal terminal window.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#151a22"/></linearGradient>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.25" fill="#d6d9df" opacity=".76"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".04"/><stop offset=".5" stop-color="#fff" stop-opacity=".88"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/></linearGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <path d="M0 92 C100 68 150 34 236 62 C300 83 340 145 424 120 L424 210 C333 224 287 168 224 154 C145 136 96 167 0 183Z" fill="url(#dots)" opacity=".82"/>
  <path d="M1200 84 C1092 61 1045 36 960 65 C892 88 851 147 770 123 L770 213 C860 224 911 169 974 154 C1053 136 1104 165 1200 184Z" fill="url(#dots)" opacity=".82"/>
